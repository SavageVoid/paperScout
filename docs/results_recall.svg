<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Grouped bar chart of recall@10 by query difficulty: keyword reaches 0.60, 0.50 and 0.30 on easy, med and hard queries; vector reaches 0.90, 0.40 and 0.20.">
  <defs>
    <style>
      .axis   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #6e7781; }
      .tier   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2328; }
      .sub    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; fill: #6e7781; }
      .val    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #57606a; }
      .valwin { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #1f2328; }
      .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #24292f; }
      .grid   { stroke: #eaeef2; stroke-width: 1; }
      .base   { stroke: #d1d9e0; stroke-width: 1; }
      .note   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #6e7781; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <!-- legend -->
  <rect x="592" y="15" width="10" height="10" rx="2" fill="#0969da"/>
  <text class="legend" x="608" y="24">keyword</text>
  <rect x="680" y="15" width="10" height="10" rx="2" fill="#8250df"/>
  <text class="legend" x="696" y="24">vector</text>

  <!-- gridlines + x axis -->
  <g>
    <line class="grid" x1="200" y1="40" x2="200" y2="252"/>
    <line class="grid" x1="312" y1="40" x2="312" y2="252"/>
    <line class="grid" x1="424" y1="40" x2="424" y2="252"/>
    <line class="grid" x1="536" y1="40" x2="536" y2="252"/>
    <line class="grid" x1="648" y1="40" x2="648" y2="252"/>
    <line class="grid" x1="760" y1="40" x2="760" y2="252"/>
    <line class="base" x1="200" y1="252" x2="770" y2="252"/>
  </g>
  <text class="axis" x="200" y="268" text-anchor="middle">0</text>
  <text class="axis" x="312" y="268" text-anchor="middle">0.2</text>
  <text class="axis" x="424" y="268" text-anchor="middle">0.4</text>
  <text class="axis" x="536" y="268" text-anchor="middle">0.6</text>
  <text class="axis" x="648" y="268" text-anchor="middle">0.8</text>
  <text class="axis" x="760" y="268" text-anchor="middle">1.0</text>
  <text class="axis" x="770" y="286" text-anchor="end">recall@10</text>

  <!-- ================= EASY ================= -->
  <text class="tier" x="24" y="62">easy</text>
  <text class="sub" x="24" y="78">title restated plainly</text>
  <rect x="200" y="50" width="336" height="16" rx="3" fill="#0969da"/>
  <text class="val" x="544" y="62">0.60</text>
  <rect x="200" y="72" width="504" height="16" rx="3" fill="#8250df"/>
  <text class="valwin" x="712" y="84">0.90</text>

  <!-- ================= MED ================= -->
  <text class="tier" x="24" y="140">med</text>
  <text class="sub" x="24" y="156">core claim, no jargon</text>
  <rect x="200" y="128" width="280" height="16" rx="3" fill="#0969da"/>
  <text class="valwin" x="488" y="140">0.50</text>
  <rect x="200" y="150" width="224" height="16" rx="3" fill="#8250df"/>
  <text class="val" x="432" y="162">0.40</text>

  <!-- ================= HARD ================= -->
  <text class="tier" x="24" y="218">hard</text>
  <text class="sub" x="24" y="234">oblique, no shared words</text>
  <rect x="200" y="206" width="168" height="16" rx="3" fill="#0969da"/>
  <text class="valwin" x="376" y="218">0.30</text>
  <rect x="200" y="228" width="112" height="16" rx="3" fill="#8250df"/>
  <text class="val" x="320" y="240">0.20</text>

  <!-- the one thing the chart exists to say -->
  <text class="note" x="24" y="290">same 10 papers in each tier · 30 queries · both modes share one 0--1 scale · bold = the winner on that tier</text>
</svg>
